services:
  mongodb:
    image: mongo:7
    container_name: hiveai-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hiveai-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongo-data:
